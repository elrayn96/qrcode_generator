name: CI - Contratos
on:
  push:
    paths: ['packages/api-contracts/**', 'redocly.yaml', '.github/workflows/validacao-contratos.yml']
  pull_request:
    branches: [main]
    paths: ['packages/api-contracts/**', 'redocly.yaml', '.github/workflows/validacao-contratos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npx --yes @redocly/cli@1.34.3 lint
