openapi: 3.1.0
info:
  title: GQR API pública
  version: 0.1.0
servers:
- url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      operationId: health
      summary: Verificar estado
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    const: ok
                  service:
                    type: string
                    minLength: 1
                    maxLength: 256
                required:
                - status
  /v1/templates:
    get:
      operationId: listTemplates
      summary: Listar modelos
      security: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: schemas/administracao.yaml#/$defs/Template
                maxItems: 100
        '429':
          description: Pedido rejeitado
          content:
            application/problem+json:
              schema:
                $ref: schemas/erro.yaml#/$defs/Problem
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 0
        '503':
          description: Pedido rejeitado
